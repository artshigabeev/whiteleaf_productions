[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dasbot"
version = "0.1.0"
description = "Automated trading against the DAS Trader CMD API"
requires-python = ">=3.11"
# No runtime dependencies: stdlib asyncio handles the socket, and the .env
# reader is in-tree. The bot runs on a bare Python install with no pip step.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
dasbot = "dasbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
